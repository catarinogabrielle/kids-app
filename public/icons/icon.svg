<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradiente de Fundo Mágico -->
    <linearGradient id="magicBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="45%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <!-- Gradiente Dourado Real / Coroa -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="40%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Gradiente Madeira da Arca -->
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="50%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <!-- Gradiente das Águas -->
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base com Cantos Arredondados estilo App AAA -->
  <rect width="512" height="512" rx="116" fill="url(#magicBg)"/>

  <!-- Brilho Interno Superior -->
  <path d="M 0 0 L 512 0 L 512 180 C 400 240 120 220 0 160 Z" fill="#FFFFFF" opacity="0.16"/>

  <!-- Arco-Íris da Aliança de Deus (4 Arcos Vibrantes) -->
  <g opacity="0.95">
    <path d="M 40 370 A 216 216 0 0 1 472 370" fill="none" stroke="#EF4444" stroke-width="20" stroke-linecap="round"/>
    <path d="M 58 370 A 198 198 0 0 1 454 370" fill="none" stroke="#F59E0B" stroke-width="18" stroke-linecap="round"/>
    <path d="M 74 370 A 182 182 0 0 1 438 370" fill="none" stroke="#10B981" stroke-width="18" stroke-linecap="round"/>
    <path d="M 90 370 A 166 166 0 0 1 422 370" fill="none" stroke="#3B82F6" stroke-width="18" stroke-linecap="round"/>
    <path d="M 106 370 A 150 150 0 0 1 406 370" fill="none" stroke="#8B5CF6" stroke-width="18" stroke-linecap="round"/>
  </g>

  <!-- Nuvens Fofas na Base do Arco-íris -->
  <g fill="#FFFFFF" opacity="0.95">
    <circle cx="60" cy="360" r="32"/>
    <circle cx="90" cy="355" r="26"/>
    <circle cx="452" cy="360" r="32"/>
    <circle cx="422" cy="355" r="26"/>
  </g>

  <!-- Sol da Graça Divina com Olhos Amigáveis -->
  <g transform="translate(110, 125)">
    <circle r="46" fill="#FDE047" stroke="#F59E0B" stroke-width="6"/>
    <!-- Raios Suaves -->
    <path d="M 0 -66 L 0 -54 M 46 -46 L 38 -38 M 66 0 L 54 0 M 46 46 L 38 38 M 0 66 L 0 54 M -46 46 L -38 38 M -66 0 L -54 0 M -46 -46 L -38 -38" stroke="#F59E0B" stroke-width="7" stroke-linecap="round"/>
    <!-- Rostinho Alegre -->
    <circle cx="-14" cy="-8" r="6" fill="#78350F"/>
    <circle cx="14" cy="-8" r="6" fill="#78350F"/>
    <circle cx="-12" cy="-10" r="2" fill="#FFFFFF"/>
    <circle cx="16" cy="-10" r="2" fill="#FFFFFF"/>
    <!-- Bochechas Coradas -->
    <ellipse cx="-20" cy="6" rx="8" ry="4" fill="#FCA5A5"/>
    <ellipse cx="20" cy="6" rx="8" ry="4" fill="#FCA5A5"/>
    <!-- Sorriso -->
    <path d="M -12 8 Q 0 20 12 8" fill="none" stroke="#78350F" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- Pombinha Branca da Paz com Ramos de Oliveira -->
  <g transform="translate(370, 115) scale(0.95)">
    <!-- Asas e Corpo -->
    <path d="M 0 0 C 12 -24 38 -34 60 -24 C 68 -20 66 -4 54 4 C 44 12 30 18 16 20 C -2 22 -14 12 0 0 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>
    <path d="M 22 -6 C 40 -38 72 -34 78 -10 C 66 -4 46 2 22 -6 Z" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="3"/>
    <!-- Bico -->
    <polygon points="62,-18 78,-16 66,-10" fill="#F59E0B"/>
    <!-- Raminho Verde -->
    <path d="M 70 -14 Q 85 -24 96 -20" stroke="#16A34A" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <circle cx="86" cy="-24" r="4.5" fill="#22C55E"/>
    <circle cx="94" cy="-18" r="4" fill="#22C55E"/>
  </g>

  <!-- A ARCA DE NOÉ DOURADA & BICHINHOS AMIGOS (CENTRAL) -->
  <g transform="translate(256, 310)">
    <!-- Cabine Superior de Madeira -->
    <rect x="-70" y="-76" width="140" height="48" rx="10" fill="url(#woodGrad)" stroke="#451A03" stroke-width="6"/>
    <!-- Telhado Triangular com Cruz da Esperança no Topo -->
    <polygon points="0,-115 -85,-72 85,-72" fill="#DC2626" stroke="#7F1D1D" stroke-width="6"/>

    <!-- Estrela Dourada no Topo do Telhado -->
    <polygon points="0,-130 5,-116 20,-116 8,-106 13,-92 0,-102 -13,-92 -8,-106 -20,-116 -5,-116" fill="url(#goldGrad)" stroke="#B45309" stroke-width="2"/>

    <!-- Janelinhas com Leãozinho e Girafinha Espiando -->
    <rect x="-52" y="-62" width="30" height="28" rx="8" fill="#FEF08A" stroke="#451A03" stroke-width="3.5"/>
    <text x="-37" y="-42" font-size="20" text-anchor="middle">🦁</text>

    <rect x="22" y="-62" width="30" height="28" rx="8" fill="#FEF08A" stroke="#451A03" stroke-width="3.5"/>
    <text x="37" y="-42" font-size="20" text-anchor="middle">🦒</text>

    <!-- Casco da Arca de Noé (Grande, Robusto e Arredondado) -->
    <path d="M -145 -30 L 145 -30 C 130 35 70 70 0 70 C -70 70 -130 35 -145 -30 Z" fill="url(#woodGrad)" stroke="#451A03" stroke-width="7"/>

    <!-- Tábuas e Frisos da Arca -->
    <path d="M -135 -6 C -60 12 60 12 135 -6" stroke="#FEF3C7" stroke-width="4.5" fill="none" opacity="0.45"/>
    <path d="M -115 22 C -50 40 50 40 115 22" stroke="#451A03" stroke-width="4.5" fill="none"/>

    <!-- Coroa Dourada de Israel / Jesus no Centro da Arca -->
    <g transform="translate(0, 16) scale(0.9)">
      <polygon points="0,-22 9,-6 24,-14 16,10 -16,10 -24,-14 -9,-6" fill="url(#goldGrad)" stroke="#78350F" stroke-width="3"/>
      <circle cx="0" cy="-22" r="3.5" fill="#EF4444"/>
      <circle cx="24" cy="-14" r="3" fill="#3B82F6"/>
      <circle cx="-24" cy="-14" r="3" fill="#3B82F6"/>
    </g>
  </g>

  <!-- Ondas do Mar Suaves em Camadas na Base -->
  <path d="M -10 435 Q 60 410 130 435 T 270 435 T 410 435 T 530 435 L 530 520 L -10 520 Z" fill="url(#waterGrad)" opacity="0.85"/>
  <path d="M -10 460 Q 60 438 130 460 T 270 460 T 410 460 T 530 460 L 530 520 L -10 520 Z" fill="#0369A1"/>

  <!-- Brilhos e Estrelinhas Cintilantes Mágicas -->
  <g fill="#FEF08A" stroke="#F59E0B" stroke-width="1.5">
    <!-- Topo Esquerda -->
    <polygon points="185,75 190,87 202,88 193,96 195,108 185,101 175,108 177,96 168,88 180,87" transform="scale(0.8) translate(40, -10)"/>
    <!-- Direita -->
    <polygon points="320,210 324,220 334,221 326,228 328,238 320,232 312,238 314,228 306,221 316,220" transform="scale(0.85) translate(45, 10)"/>
  </g>

  <!-- Nome Mundinho Mágico na Base -->
  <g transform="translate(256, 484)">
    <rect x="-140" y="-18" width="280" height="34" rx="17" fill="#FFFFFF" stroke="#0284C7" stroke-width="3" filter="url(#softGlow)"/>
    <text x="0" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="900" fill="#0C4A6E" text-anchor="middle" letter-spacing="1">
      MUNDINHO MÁGICO ✨
    </text>
  </g>
</svg>
